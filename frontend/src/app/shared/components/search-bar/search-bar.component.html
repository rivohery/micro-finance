<div class="relative w-full max-w-2xl mx-auto">
  <div
    class="flex items-center bg-white rounded-xl border border-gray-200 shadow-sm transition-all duration-300 focus-within:shadow-md focus-within:border-blue-400 overflow-hidden px-3 py-1"
  >
    <mat-icon class="text-gray-400 mr-2">search</mat-icon>

    @if(modeSearch() === 'keyup'){
    <input
      type="text"
      [formControl]="searchControl"
      [placeholder]="placeholder()"
      class="flex-grow bg-transparent border-none outline-none text-gray-700 placeholder-gray-400 text-sm md:text-base py-2"
      (keyup)="onSearch()"
    />
    } @else {
    <input
      type="text"
      [formControl]="searchControl"
      [placeholder]="placeholder()"
      class="flex-grow bg-transparent border-none outline-none text-gray-700 placeholder-gray-400 text-sm md:text-base py-2"
    />
    }

    <!--Clear search icon-->
    @if(searchControl.value){
    <button
      mat-icon-button
      (click)="clearSearch()"
      matTooltip="Effacer"
      class="text-gray-400 hover:text-red-500 transition-colors"
    >
      <mat-icon class="text-sm">close</mat-icon>
    </button>
    }

    <!--Button search-->
    @if(modeSearch() !== 'keyup'){
    <div class="h-6 w-[1px] bg-gray-200 mx-2 hidden sm:block"></div>

    <button
      mat-button
      color="primary"
      (click)="onSearch()"
      class="hidden sm:flex items-center font-medium rounded-lg"
    >
      Rechercher
    </button>

    <button
      mat-icon-button
      color="primary"
      (click)="onSearch()"
      class="sm:hidden"
    >
      <mat-icon>arrow_forward</mat-icon>
    </button>
    }
  </div>

  <div class="absolute right-3 -bottom-6 hidden md:block">
    <span class="text-[10px] text-gray-400 uppercase tracking-tighter">
      Appuyez sur <kbd class="bg-gray-100 px-1 rounded border">Entrée</kbd> pour
      valider
    </span>
  </div>
</div>
