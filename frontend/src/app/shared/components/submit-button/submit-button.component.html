<button
  type="submit"
  [disabled]="isLoading()"
  class="group relative w-full flex justify-center items-center gap-3 px-6 py-3 rounded-xl font-semibold tracking-wide text-white bg-blue-600 transition-all duration-200 ease-in-out hover:bg-blue-700 hover:shadow-lg active:scale-[0.97] disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:shadow-none"
>
  @if(isLoading()){
  <svg
    class="animate-spin h-5 w-5 text-white"
    xmlns="http://www.w3.org/2000/svg"
    fill="none"
    viewBox="0 0 24 24"
  >
    <circle
      class="opacity-25"
      cx="12"
      cy="12"
      r="10"
      stroke="currentColor"
      stroke-width="4"
    ></circle>
    <path
      class="opacity-75"
      fill="currentColor"
      d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
    ></path>
  </svg>
  } @if(isLoading()){
  <span>{{ loadingLabel() }}</span>
  } @else {
  <span>{{ label() }}</span>
  <mat-icon class="scale-75">{{ icon() }}</mat-icon>
  }
</button>
