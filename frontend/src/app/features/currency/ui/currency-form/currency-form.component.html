<div class="max-w-md mx-auto">
  <div
    class="shadow-md border border-slate-200 overflow-hidden p-4 flex flex-col gap-4 rounded-2xl"
  >
    <!-- En-tête du formulaire -->
    <div class="flex items-center gap-4">
      <mat-icon class="text-indigo-600">payments</mat-icon>
      <h2 class="text-xl font-extrabold text-slate-800 tracking-tight m-0">
        Nouvelle Devise
      </h2>
    </div>

    <form
      [formGroup]="currencyForm"
      #formDirective="ngForm"
      (ngSubmit)="addCurrency(formDirective)"
      class="flex flex-col gap-2"
    >
      <app-input
        [control]="name"
        [placeholder]="'Ex: Dollar'"
        [label]="'Nom de la monnaie'"
        [icon]="'label'"
        [iconPosition]="'suffix'"
        [errors]="[
          { value: 'required', message: 'Nom de la monnaie obligatoire' }
        ]"
      ></app-input>

      <app-input
        [control]="code"
        [placeholder]="'Ex: USD'"
        [label]="'Code ISO'"
        [icon]="'code'"
        [iconPosition]="'suffix'"
        [errors]="[
          { value: 'required', message: 'Code de la monnaie obligatoire' },
          { value: 'maxlength', message: 'Code de la monnaie invalide' },
          { value: 'pattern', message: 'Code de la monnaie invalide' }
        ]"
      ></app-input>

      <button
        [disabled]="sending()"
        type="submit"
        class="flex items-center justify-center py-3 rounded-lg shadow-indigo-200 shadow-lg w-full bg-blue-700 hover:bg-blue-800 text-white"
      >
        @if(sending()){
        <span>Envoie en cours...</span>
        } @else {
        <mat-icon class="mr-2">add_circle</mat-icon>
        Ajouter }
      </button>
    </form>
  </div>
</div>
