@if(loading()){
<div
  class="w-full h-['400px'] max-w-md bg-white rounded-2xl overflow-hidden shadow-2xl border border-slate-100 flex flex-col justify-center items-center"
>
  <span class="text-gray-400 font-light text-md">chargement...</span>
</div>
} @else {
<div
  class="w-full max-w-md bg-white rounded-2xl overflow-hidden shadow-2xl border border-slate-100 flex flex-col"
>
  <!-- EN-TÊTE DU MODAL -->
  <div
    class="bg-gradient-to-r from-slate-900 to-indigo-950 px-6 py-5 flex items-center justify-between text-white"
  >
    <div class="flex items-center gap-3">
      <div class="p-2 bg-white/10 rounded-xl text-indigo-400">
        <mat-icon class="scale-110">add_box</mat-icon>
      </div>
      <div>
        <h2 class="text-base font-extrabold tracking-tight m-0 uppercase">
          Nouveau Compte
        </h2>
        <p class="text-[10px] text-slate-400 font-medium tracking-wide m-0">
          Souscription à un produit financier
        </p>
      </div>
    </div>

    <!-- Bouton de fermeture croix rapide -->
    <button
      mat-icon-button
      (click)="onCancel()"
      class="text-slate-400 hover:text-white transition-colors"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- CORPS DU MODAL (FORMULAIRE) -->
  <form
    [formGroup]="createAccountForm"
    (ngSubmit)="onSubmit()"
    class="p-6 flex flex-col gap-5"
  >
    <p class="text-xs text-slate-500 font-medium leading-relaxed">
      Sélectionnez les paramètres de base ci-dessous pour initialiser le nouveau
      livret de transactions de l'adhérent.
    </p>

    <!-- Champ : Type de compte -->
    <app-select
      [label]="'Type de compte'"
      [icon]="'layers'"
      [control]="accountTypeCode"
      [matlabel]="'Choisir une offre'"
      [hint]="'Ce champ est obligatoire *'"
      [options]="accountTypeOptions"
    ></app-select>

    <!-- Champ : Monnaie disponible -->
    <app-select
      [label]="'Devise pivot du compte'"
      [icon]="'euro_symbol'"
      [control]="currencyCode"
      [matlabel]="'Choisir la monnaie'"
      [hint]="'Ce champ est obligatoire *'"
      [options]="currencyOptions"
    ></app-select>

    <!-- SECTION DES BOUTONS (PIED DE PAGE) -->
    <div
      class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100 mt-2"
    >
      <!-- Bouton Annuler -->
      <button
        mat-button
        type="button"
        (click)="onCancel()"
        class="!px-5 !py-5.5 !rounded-xl !text-slate-600 hover:!bg-slate-100 !font-bold !text-xs uppercase tracking-wide"
      >
        Annuler
      </button>

      <!-- Bouton Valider l'ajout -->
      <button
        mat-raised-button
        color="primary"
        type="submit"
        [disabled]="createAccountForm.invalid || creating()"
        class="!px-6 !py-5.5 !rounded-xl shadow-lg shadow-indigo-100 font-bold !text-xs uppercase tracking-wide disabled:!opacity-50"
      >
        <mat-icon class="mr-1.5 scale-90">check_circle</mat-icon>
        Créer le compte
      </button>
    </div>
  </form>
</div>
}
