<div
  class="p-4 sm:p-8 bg-slate-50 min-h-screen flex flex-col items-center justify-start"
>
  <div class="w-full max-w-2xl">
    <div
      class="bg-white rounded-3xl shadow-sm border border-slate-200/60 overflow-hidden"
    >
      <div
        class="bg-gradient-to-r from-indigo-900 to-slate-900 p-6 flex items-center gap-4 text-white"
      >
        <div
          class="w-12 h-12 bg-white/10 rounded-2xl flex items-center justify-center text-indigo-400 shadow-inner"
        >
          <mat-icon class="scale-110">sync_alt</mat-icon>
        </div>
        <div>
          <h1 class="text-base font-extrabold m-0 uppercase tracking-wider">
            Virement Interne
          </h1>
          <p class="text-xs text-slate-400 font-medium m-0">
            Transférer des fonds instantanément entre deux comptes de la
            micro-finance
          </p>
        </div>
      </div>

      <div class="w-full my-4" *ngIf="errorMsg()">
        <app-message-box
          [type]="'error'"
          [message]="errorMsg()"
          (onClose)="closeErrorMsg($event)"
        ></app-message-box>
      </div>

      <form
        [formGroup]="transferForm"
        #formDirective="ngForm"
        (ngSubmit)="onExecuteTransfer(formDirective)"
        class="p-6 sm:p-8 flex flex-col gap-6"
      >
        <div
          *ngIf="isSameAccounts"
          class="bg-rose-50 border border-rose-100 rounded-xl p-3 flex items-center gap-2.5 text-rose-700 text-xs font-semibold"
        >
          <mat-icon class="text-sm">error_outline</mat-icon>
          <span
            >Le compte de destination doit obligatoirement être différent du
            compte d'origine.</span
          >
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 relative">
          <div
            class="bg-slate-50 border border-slate-100 p-4 rounded-2xl flex flex-col"
          >
            <label
              class="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-2 flex items-center gap-1"
            >
              <span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span>
              Compte à Débiter (Source)
            </label>
            <app-input
              [label]="'Numéro de compte émetteur'"
              [placeholder]="'Ex: 010-10-XXXXX'"
              [icon]="'launch'"
              [iconPosition]="'suffix'"
              [control]="sourceAccountNumber"
              [errors]="[
                {
                  value: 'required',
                  message: 'Numéros du compte source obligatoire'
                }
              ]"
            ></app-input>
          </div>

          <div
            class="bg-slate-50 border border-slate-100 p-4 rounded-2xl flex flex-col"
          >
            <label
              class="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-2 flex items-center gap-1"
            >
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
              Compte à Créditer (Cible)
            </label>
            <app-input
              [label]="'Numéro de compte destinataire'"
              [placeholder]="'Ex: 010-10-XXXXX'"
              [icon]="'login'"
              [iconPosition]="'suffix'"
              [control]="targetAccountNumber"
              [errors]="[
                {
                  value: 'required',
                  message: 'Numéros du compte cible obligatoire'
                }
              ]"
            ></app-input>
          </div>
        </div>
        <mat-divider></mat-divider>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="flex flex-col md:col-span-1">
            <label
              class="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-2 flex items-center gap-1"
            >
              <mat-icon class="text-[14px] !w-3.5 !h-3.5"
                >monetization_on</mat-icon
              >
              Volume de l'envoi
            </label>
            <app-number
              [control]="transfertAmount"
              [placeholder]="'100.0'"
              [label]="'Montant'"
              [icon]="'monetization_on'"
              [iconPosition]="'suffix'"
              [errors]="[
                {
                  value: 'required',
                  message: 'Montant du transfert obligatoire'
                },
                { value: 'min', message: 'Solde minimale accépté est 100' }
              ]"
            ></app-number>
          </div>

          <div class="flex flex-col md:col-span-2">
            <label
              class="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-2 flex items-center gap-1"
            >
              <mat-icon class="text-[14px] !w-3.5 !h-3.5">comment</mat-icon>
              Raison de l'écriture comptable
            </label>
            <app-input
              [control]="description"
              [placeholder]="'Ex: Approvisionnement ou Remboursement...'"
              [label]="'Motif ou libellé du virement'"
              [icon]="'description'"
              [iconPosition]="'suffix'"
              [errors]="[
                {
                  value: 'required',
                  message: 'Motif du transfert obligatoire'
                },
                {
                  value: 'minlength',
                  message: 'Le motif doit être compris entre 5 à 100 caractères'
                },
                {
                  value: 'maxlength',
                  message: 'Le motif doit être compris entre 5 à 100 caractères'
                }
              ]"
            ></app-input>
          </div>
        </div>

        <div
          class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100 mt-2"
        >
          <button
            mat-button
            type="button"
            (click)="onReset()"
            class="!px-6 !py-5.5 !rounded-xl !text-slate-500 hover:!bg-slate-100 font-bold text-xs uppercase tracking-wide"
          >
            Annuler l'action
          </button>

          <button
            mat-raised-button
            color="primary"
            type="submit"
            [disabled]="transferForm.invalid || sending()"
            class="!px-8 !py-5.5 !rounded-xl shadow-lg shadow-indigo-100 font-bold text-xs uppercase tracking-wide"
          >
            <mat-icon class="mr-1.5 scale-90">lock</mat-icon>
            Confirmer l'envoi
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
