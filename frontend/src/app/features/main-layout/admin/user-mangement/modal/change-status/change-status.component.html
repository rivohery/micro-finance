<div class="p-4 sm:p-6 max-w-full">
  <div class="flex items-center gap-3 mb-6 border-b pb-4">
    <div class="p-2 bg-amber-100 rounded-lg">
      <mat-icon class="text-amber-600">manage_accounts</mat-icon>
    </div>
    <div>
      <h2 class="text-xl font-bold text-gray-800 m-0">Modifier le Statut</h2>
      <p class="text-xs text-gray-500 italic uppercase tracking-wider">
        Gestion des accès
      </p>
    </div>
  </div>

  <div class="bg-gray-50 rounded-xl p-4 mb-6 border border-gray-100">
    <p class="text-xs font-semibold text-gray-400 uppercase mb-3">
      Détails du compte
    </p>
    <div class="flex flex-col gap-2">
      <div class="flex justify-between">
        <span class="text-sm text-gray-500">Utilisateur :</span>
        <span class="text-sm font-bold text-gray-800">{{ data.username }}</span>
      </div>
      <div class="flex justify-between">
        <span class="text-sm text-gray-500">Rôle assigné :</span>
        <span
          class="text-xs font-medium bg-blue-100 text-blue-700 px-2 py-0.5 rounded uppercase"
        >
          {{ data.role }}
        </span>
      </div>
    </div>
  </div>

  <div class="mb-8 p-2">
    <mat-checkbox
      color="primary"
      [(ngModel)]="statusValue"
      class="font-medium text-gray-700"
    >
      <div class="flex flex-col ml-1">
        <span>{{ statusValue ? "Compte Activé" : "Compte Désactivé" }}</span>
        <span class="text-xs font-normal text-gray-400">
          {{
            statusValue
              ? "L'utilisateur peut se connecter"
              : "L'accès sera bloqué immédiatement"
          }}
        </span>
      </div>
    </mat-checkbox>
  </div>

  <div
    class="flex flex-col sm:flex-row items-center justify-end gap-3 pt-4 border-t"
  >
    <button
      mat-button
      (click)="onCancel()"
      class="w-full sm:w-auto order-2 sm:order-1"
    >
      Annuler
    </button>
    <button
      mat-raised-button
      color="primary"
      [disabled]="updating()"
      (click)="onConfirm()"
      class="w-full sm:w-auto order-1 sm:order-2 px-6 shadow-md"
    >
      Mettre à jour le statut
    </button>
  </div>
</div>
