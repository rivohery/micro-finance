<div class="p-4 sm:p-6 max-w-full">
  <div class="flex items-center gap-3 mb-6 border-b pb-4">
    <div class="p-2 bg-indigo-100 rounded-lg">
      <mat-icon class="text-indigo-600">published_with_changes</mat-icon>
    </div>
    <div>
      <h2 class="text-xl font-bold text-gray-800 m-0">Statut du Client</h2>
      <p class="text-xs text-gray-500 uppercase tracking-widest font-semibold">
        Mise à jour du dossier
      </p>
    </div>
  </div>

  <div class="bg-gray-50 rounded-xl p-4 mb-6 border border-gray-100">
    <div class="flex items-center gap-3">
      <div
        class="w-10 h-10 rounded-full bg-white flex items-center justify-center border shadow-sm text-indigo-600 font-bold"
      >
        {{ data.lastName[0] }}{{ data.firstName[0] }}
      </div>
      <div class="flex flex-col">
        <span class="text-sm font-bold text-gray-800"
          >{{ data.lastName }} {{ data.firstName }}</span
        >
        <span class="text-[10px] text-gray-400 uppercase tracking-tighter"
          >Identité du titulaire</span
        >
      </div>
    </div>
  </div>

  <div class="mb-8">
    <label class="text-xs font-bold text-gray-400 uppercase mb-4 block"
      >Choisir le nouvel état :</label
    >

    <mat-radio-group [(ngModel)]="selectedStatus" class="flex flex-col gap-3">
      <div
        [ngClass]="{
          'bg-green-50 border-green-200': selectedStatus === 'ACTIVE'
        }"
        class="border rounded-lg p-3 transition-all flex items-center justify-between group hover:border-green-300"
      >
        <mat-radio-button value="ACTIVE" color="primary">
          <span class="text-sm font-semibold text-gray-700">ACTIVE</span>
        </mat-radio-button>
        <mat-icon class="text-green-500 opacity-50 group-hover:opacity-100"
          >check_circle</mat-icon
        >
      </div>

      <div
        [ngClass]="{
          'bg-amber-50 border-amber-200': selectedStatus === 'PENDING'
        }"
        class="border rounded-lg p-3 transition-all flex items-center justify-between group hover:border-amber-300"
      >
        <mat-radio-button value="PENDING" color="primary">
          <span class="text-sm font-semibold text-gray-700">PENDING</span>
        </mat-radio-button>
        <mat-icon class="text-amber-500 opacity-50 group-hover:opacity-100"
          >hourglass_empty</mat-icon
        >
      </div>

      <div
        [ngClass]="{
          'bg-red-50 border-red-200': selectedStatus === 'SUSPENDED'
        }"
        class="border rounded-lg p-3 transition-all flex items-center justify-between group hover:border-red-300"
      >
        <mat-radio-button value="SUSPENDED" color="primary">
          <span class="text-sm font-semibold text-gray-700">SUSPENDED</span>
        </mat-radio-button>
        <mat-icon class="text-red-500 opacity-50 group-hover:opacity-100"
          >block</mat-icon
        >
      </div>
    </mat-radio-group>
  </div>

  <div
    class="flex flex-col sm:flex-row items-center justify-end gap-3 pt-4 border-t"
  >
    <button
      mat-button
      (click)="onCancel()"
      class="w-full sm:w-auto order-2 sm:order-1"
    >
      Annuler
    </button>
    <button
      mat-raised-button
      color="primary"
      (click)="onConfirm()"
      class="w-full sm:w-auto order-1 sm:order-2 px-8 shadow-md"
      [disabled]="loading()"
    >
      Enregistrer
    </button>
  </div>
</div>
