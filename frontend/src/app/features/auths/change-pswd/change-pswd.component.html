<div
  class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-12 sm:px-6 lg:px-8"
>
  <div
    class="max-w-md w-full space-y-8 bg-white p-8 rounded-2xl shadow-xl border border-gray-100"
  >
    <div class="text-center">
      <div
        class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-amber-100 mb-4"
      >
        <mat-icon class="text-amber-600">published_with_changes</mat-icon>
      </div>
      <h2 class="text-2xl font-extrabold text-gray-900 tracking-tight">
        Sécurisez votre compte
      </h2>
      <p class="mt-2 text-sm text-gray-500">
        Modifier vos identifiants de connexion
      </p>
    </div>

    @if(errorMsg()){
    <app-message-box
      [type]="'error'"
      [message]="errorMsg()"
      (onClose)="closeMsgBox($event)"
    ></app-message-box>
    }

    <form
      class="mt-8 flex flex-col"
      [formGroup]="changePswdForm"
      (ngSubmit)="changePassword()"
    >
      <app-input
        [control]="username"
        [placeholder]="'Ex. jean_dupont'"
        [icon]="'person'"
        [label]="'Pseudo'"
        [errors]="[{ value: 'required', message: 'Votre pseudo est récquis' }]"
      ></app-input>

      <app-password
        [control]="oldPassword"
        [label]="'Ancien mot de passe'"
        [errors]="[
          { value: 'required', message: 'Votre mots de passe est récquis' }
        ]"
      ></app-password>

      <app-password
        [control]="newPassword"
        [label]="'Nouveau mot de passe'"
        [errors]="[
          { value: 'required', message: 'Votre mots de passe est récquis' },
          {
            value: 'minlength',
            message: 'Le mots de passe doit avoir au moins 4 caractères'
          }
        ]"
      ></app-password>

      <app-submit-button
        [isLoading]="loading()"
        [label]="'Modifier'"
        [loadingLabel]="'Modification...'"
        [icon]="'update'"
      ></app-submit-button>

      <div class="text-center mt-4">
        <a
          routerLink="/login"
          class="text-sm font-medium text-gray-500 hover:text-indigo-600 transition-colors flex items-center justify-center gap-1"
        >
          <mat-icon class="text-sm scale-75">arrow_back</mat-icon>
          Retour à la connexion
        </a>
      </div>
    </form>
  </div>
</div>
