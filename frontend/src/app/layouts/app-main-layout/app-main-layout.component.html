<div class="flex flex-col h-screen overflow-hidden bg-gray-50">
  <mat-toolbar
    color="primary"
    class="z-20 shadow-md flex justify-between items-center px-4"
  >
    <div class="flex items-center gap-2">
      <button mat-icon-button (click)="drawer.toggle()" class="lg:hidden">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="font-bold tracking-wider text-xl uppercase"
        >Financia<span class="text-yellow-400">Hub</span></span
      >
    </div>

    <app-navbar-left-menu></app-navbar-left-menu>
  </mat-toolbar>

  <mat-drawer-container class="flex-grow" autosize>
    <mat-drawer
      #drawer
      mode="side"
      opened="true"
      class="w-64 border-r border-gray-200"
      [mode]="isMobile ? 'over' : 'side'"
    >
      <app-sidebar></app-sidebar>
    </mat-drawer>

    <mat-drawer-content class="p-2 overflow-y-auto bg-gray-50">
      <div class="max-w-7xl mx-auto p-4">
        <router-outlet></router-outlet>
      </div>
    </mat-drawer-content>
  </mat-drawer-container>
</div>
