spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB
  # Pour empécher spring Boot de lancer le Job immédiatement au démarrage.
  batch:
    job:
      enabled: false
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:test}
    password: ${SPRING_MAIL_PSW:test}
    properties:
      mail:
        smtp:
          trust: "*"
          auth: true
          starttls:
            enabled: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000
        debug: true
