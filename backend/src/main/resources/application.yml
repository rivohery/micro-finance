resilience4j:
  # CONFIGURATION DU RETRY (La persévérance à court terme: la tentative)
  retry:
    instances:
      currencyRetry:
        max-attempts: 3        # Nombre d'essais total
        wait-duration: 1s      # Pause entre les essais
        retry-exceptions:      # On ne retente que sur ces erreurs
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException

  # CONFIGURATION DU CIRCUIT BREAKER (La protection à long terme: le Disjoncteur)
  circuitbreaker:
    instances:
      currencyCB:
        failure-rate-threshold: 50   # Si 50% d'erreurs, on coupe tout
        sliding-window-size: 10      # On regarde les 10 derniers appels
        wait-duration-in-open-state: 30s # Temps avant de retenter l'API tiers



