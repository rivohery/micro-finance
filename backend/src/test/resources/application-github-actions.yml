# ============================================
# PROFIL GITHUB ACTIONS - TESTS D'INTÉGRATION
# ============================================

# ---------- BASE DE DONNÉES POSTGRESQL ----------
# On utilise le service PostgreSQL lancé dans GitHub Actions
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/testdb
    username: testuser
    password: testpass
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  security:
    enabled: false
  
# ---------- LOGGING ----------
logging:
  level:
    org:
      springframework: WARN
      hibernate: WARN

