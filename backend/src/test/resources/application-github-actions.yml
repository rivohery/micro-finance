# ============================================
# PROFIL GITHUB ACTIONS - TESTS D'INTÉGRATION
# ============================================

# ---------- BASE DE DONNÉES POSTGRESQL ----------
# On utilise le service PostgreSQL lancé dans GitHub Actions
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/testdb
    username: testuser
    password: testpass
    driver-class-name: org.postgresql.Driver

  # ---------- JPA/HIBERNATE ----------
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  # ---------- SPRING SECURITY (si tu utilises) ----------
  # Désactiver la sécurité pour les tests (simplifie)
  security:
    enabled: false
  
# ---------- LOGGING ----------
logging:
  level:
    org:
      springframework: WARN
      hibernate: WARN