# ================================================================
# PIPELINE CI BACKEND - BUILD & TEST (Testcontainers)
# ================================================================
# Approche professionnelle : Testcontainers gère PostgreSQL
# automatiquement, aucune image de service externe nécessaire.
# ================================================================

name: CI Backend - Build & Test

# ================================================================
# 1. DÉCLENCHEURS
# ================================================================
on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

# ================================================================
# 2. VARIABLES D'ENVIRONNEMENT
# ================================================================
env:
  BACKEND_DIR: ./backend
  JAVA_VERSION: 17

# ================================================================
# 3. JOBS
# ================================================================
jobs:

  build-and-test:
    name: 🔧 Build & Test (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ----------------------------------------------------------------
      # ÉTAPE 1 : Récupérer le code
      # ----------------------------------------------------------------
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # ÉTAPE 2 : Installer Java + cache Maven
      # ----------------------------------------------------------------
      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      # ----------------------------------------------------------------
      # ÉTAPE 3 : Vérifier Docker (indispensable pour Testcontainers)
      #           Sur ubuntu-latest, Docker est déjà installé.
      #           On vérifie juste que tout fonctionne.
      # ----------------------------------------------------------------
      - name: 🐳 Verify Docker availability
        run: |
          docker --version
          docker info

      # ----------------------------------------------------------------
      # ÉTAPE 4 : Build + Tests (unitaires + intégration Testcontainers)
      # ----------------------------------------------------------------
      - name: 🧪 Unit tests
        run: mvn test -B
        working-directory: ${{ env.BACKEND_DIR }}

      - name: 🔗 Integration tests (Testcontainers)
        run: mvn verify -B
        working-directory: ${{ env.BACKEND_DIR }}

      # ----------------------------------------------------------------
      # ÉTAPE 5 : Upload du rapport de couverture Jacoco
      #           (uniquement si généré)
      # ----------------------------------------------------------------
      - name: 📊 Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: ${{ env.BACKEND_DIR }}/target/site/jacoco/
          if-no-files-found: ignore

      # ----------------------------------------------------------------
      # ÉTAPE 6 : Upload des rapports de tests (Surefire/Failsafe)
      # ----------------------------------------------------------------
      - name: 📋 Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            ${{ env.BACKEND_DIR }}/target/surefire-reports/
            ${{ env.BACKEND_DIR }}/target/failsafe-reports/
          if-no-files-found: ignore