# ================================================================
# PIPELINE CI BACKEND - BUILD & TEST (Testcontainers)
# ================================================================
# Approche professionnelle : Testcontainers gère PostgreSQL
# automatiquement, aucune image de service externe nécessaire.
# ================================================================

name: CI pipeline - Build & Test

# ================================================================
# 1. DÉCLENCHEURS
# ================================================================
on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

# ================================================================
# 2. VARIABLES D'ENVIRONNEMENT
# ================================================================
env:
  BACKEND_DIR: ./backend
  JAVA_VERSION: 17

# ================================================================
# 3. JOBS
# ================================================================
jobs:

  backend:
    name: 🔧 Build & Test (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ----------------------------------------------------------------
      # ÉTAPE 1 : Récupérer le code
      # ----------------------------------------------------------------
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # ÉTAPE 2 : Installer Java + cache Maven
      # ----------------------------------------------------------------
      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      # ----------------------------------------------------------------
      # ÉTAPE 3 : Vérifier Docker (indispensable pour Testcontainers)
      #           Sur ubuntu-latest, Docker est déjà installé.
      #           On vérifie juste que tout fonctionne.
      # ----------------------------------------------------------------
      - name: 🐳 Verify Docker availability
        run: |
          docker --version
          docker info

      # ----------------------------------------------------------------
      # ÉTAPE 4 : Build + Tests (unitaires + intégration Testcontainers)
      # ----------------------------------------------------------------
      - name: 🧪 Unit tests
        run: mvn test -B
        working-directory: ${{ env.BACKEND_DIR }}

      - name: 🔗 Integration tests (Testcontainers)
        run: mvn verify -B
        working-directory: ${{ env.BACKEND_DIR }}

      # ----------------------------------------------------------------
      # ÉTAPE 5 : Upload du rapport de couverture Jacoco
      #           (uniquement si généré)
      # ----------------------------------------------------------------
      - name: 📊 Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: ${{ env.BACKEND_DIR }}/target/site/jacoco/
          if-no-files-found: ignore

      # ----------------------------------------------------------------
      # ÉTAPE 6 : Upload des rapports de tests (Surefire/Failsafe)
      # ----------------------------------------------------------------
      - name: 📋 Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            ${{ env.BACKEND_DIR }}/target/surefire-reports/
            ${{ env.BACKEND_DIR }}/target/failsafe-reports/
          if-no-files-found: ignore


  
  frontend:
    name: 🎨 Build & Test Angular
    runs-on: ubuntu-latest
    timeout-minutes: 20   # Sécurité : évite qu'un job bloqué consomme des minutes indéfiniment
    permissions:
      contents: read

    env:
      CI: true


    steps:
      # ─────────────────────────────────────────────────────────────
      # 1. Récupération du code source du repo dans le runner GitHub
      # ─────────────────────────────────────────────────────────────
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────
      # 2. Installation de Node.js 20 (LTS compatible Angular 17/18/19)
      #    - cache: 'npm' active le cache des dépendances npm entre les runs
      #      → accélère fortement les builds successifs.
      # ─────────────────────────────────────────────────────────────
      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ─────────────────────────────────────────────────────────────
      # 3. Installation déterministe des dépendances
      #    `npm ci` (et non `npm install`) :
      #      - utilise package-lock.json → versions exactes reproductibles
      #      - plus rapide, échoue si le lockfile est désynchronisé
      #    working-directory : on se place dans ./frontend avant d'exécuter.
      # ─────────────────────────────────────────────────────────────
      - name: 📦 Install dependencies
        run: npm ci
        working-directory: ./frontend

      # ─────────────────────────────────────────────────────────────
      # 4. Exécution des tests unitaires (Karma + Jasmine par défaut)
      #    - --watch=false      : mode CI, on ne reste pas en attente
      #    - --browsers=...     : navigateur headless (Aucune fenêtre affichée) obligatoire sur runner
      #    - --no-progress      : sortie plus lisible en CI (optionnel)
      # ─────────────────────────────────────────────────────────────
      - name: 🧪 Unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless --no-progress
        working-directory: ./frontend

      # ─────────────────────────────────────────────────────────────
      # 5. Build de production Angular
      #    - `--configuration=production` active les optimisations
      #      (AOT, minification, budgets, hashing, tree-shaking).
      #    - Le dossier de sortie par défaut est dist/<nom-projet>.
      # ─────────────────────────────────────────────────────────────
      - name: 🏗️ Build production
        run: npm run build -- --configuration=production
        working-directory: ./frontend

      # ─────────────────────────────────────────────────────────────
      # 6. (AJOUT RECOMMANDÉ) Upload des artefacts de build
      #    Permet de récupérer/consommer le dossier dist dans un job
      #    de déploiement ou pour inspection manuelle.
      # ─────────────────────────────────────────────────────────────
      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error